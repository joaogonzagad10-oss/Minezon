name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
      - name: Abrir o zip e compilar
        run: |
          mkdir work
          unzip -q ./*.zip -d work
          DIR="$(dirname "$(find work -name build.gradle | head -1)")"
          echo "Projeto em: $DIR"
          cd "$DIR"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iasuprema-jar
          path: work/**/build/libs/*.jar
