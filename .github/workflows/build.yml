name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
      - name: Abrir o zip e compilar
        run: |
          mkdir work
          unzip -q ./*.zip -d work
          DIR="$(dirname "$(find work -name build.gradle | head -1)")"
          echo "Projeto em: $DIR"
          cd "$DIR"
          gradle build --no-daemon
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: IA Suprema build ${{ github.run_number }}
          files: work/**/build/libs/*.jar
